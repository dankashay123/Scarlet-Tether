  flask: { cd: 6, flight: 0.45, radius: 30, time: 4, dps: 8, splash: 8, slow: 0.45, range: 170 },
  chain: { cd: 8, range: 150, links: 4, linkRange: 64, bind: 2, dmg: 14, speed: 420 },
  penance: { charge: 160, time: 3, every: 0.07, dmg: 12, radius: 14 },

  descent: { time: 180, finale: 30 },  // seconds the candle burns; the last stretch surges
  ambient: 'rgba(8,5,14,0.52)',  // Undercroft darkness: torchlit, not pitch black
};
T.moveSpeed *= WS; T.dash.speed *= WS; T.crossbow.range *= WS; T.crossbow.speed *= WS; T.thurible.radius *= WS;
T.flask.radius *= WS; T.flask.range *= WS; T.flask.splash *= WS; T.chain.range *= WS; T.chain.linkRange *= WS; T.chain.speed *= WS; T.penance.radius *= WS;
// ------------------------------------------------------------ display ---
const screen = document.getElementById('screen');
const sctx = screen.getContext('2d');
// The game draws straight into the screen canvas at its small internal size;
// CSS scales it up by a whole number with pixelated sampling (no blit).
// We draw into an offscreen buffer at the view size, then copy it to the
// screen canvas at the next whole-number scale (nearest neighbour). CSS
// then shrinks that slightly with smoothing, so pixels stay sharp and even
// at any screen height.
const buf = document.createElement('canvas');
const ctx = buf.getContext('2d');
const dark = document.createElement('canvas');
const dctx = dark.getContext('2d');
let W = 480, H = 270, SCALE = 1, PRE = 1, darkBase = null;

// The game is always landscape: held upright, the canvas is turned a
// quarter turn so its long side runs down the screen (see toLocal).
let PORTRAIT = false;
let VIEW_SEEN = '';
function resize() {
  const dpr = window.devicePixelRatio || 1;
  // Size from the visible area: on iPhone Safari innerHeight can lag behind
  // the toolbars hiding or showing, which left a black band at the top.
  const vv = window.visualViewport, iw = vv ? vv.width : innerWidth, ih = vv ? vv.height : innerHeight;
  const ox = vv ? vv.offsetLeft : 0, oy = vv ? vv.offsetTop : 0;
  if (iw < 50 || ih < 50) return; // Safari reports an empty view while switching apps: keep the last size
  VIEW_SEEN = `${iw}x${ih}x${ox}x${oy}x${dpr}`;
  if (scrollX || scrollY) scrollTo(0, 0);
  PORTRAIT = ih > iw;
  const vw = PORTRAIT ? ih : iw, vh = PORTRAIT ? iw : ih;
  const dw = Math.floor(vw * dpr), dh = Math.floor(vh * dpr);
  // Always a whole-number scale with nearest-neighbour pixels, so every art
  // pixel is a crisp square block on screen (the Otherworld Legends look).
  // Pick the whole scale whose view height lands closest to the target.
  const k = dh / T.viewH, lo = Math.max(1, Math.floor(k)), hi = Math.max(1, Math.ceil(k));
  SCALE = Math.abs(dh / lo - T.viewH) <= Math.abs(dh / hi - T.viewH) ? lo : hi;
  H = Math.floor(dh / SCALE);
  W = Math.round(dw / SCALE);
  PRE = Math.max(1, Math.ceil(SCALE - 0.001));
  buf.width = W; buf.height = H;
  screen.width = W * PRE; screen.height = H * PRE;
  // The darkness is a soft gradient: render it at half size and scale it up.
  dark.width = Math.ceil(W / 2); dark.height = Math.ceil(H / 2); darkBase = null;
  const cw = W * SCALE / dpr, ch = H * SCALE / dpr;
  screen.style.width = cw + 'px'; screen.style.height = ch + 'px';
  screen.style.left = (ox + (iw - cw) / 2) + 'px'; screen.style.top = (oy + (ih - ch) / 2) + 'px';
  screen.style.transform = PORTRAIT ? 'rotate(90deg)' : '';
  screen.style.imageRendering = PRE === SCALE ? '' : 'auto';
  ctx.imageSmoothingEnabled = sctx.imageSmoothingEnabled = false;
  readSafe(PORTRAIT ? ih : iw, cw);
  layoutHud();
}
function blit() { if (!buf.width || !buf.height || !screen.width) return; sctx.drawImage(buf, 0, 0, W * PRE, H * PRE); }

async function checkBuild() {
  try {
    const t = await (await fetch(`${location.pathname}?build=${Date.now()}`, { cache: 'no-store' })).text(), m = t.match(/const BUILD = '([^']+)'/);
    if (!m || m[1] === BUILD) return;
    if (typeof game !== 'undefined' && game.scene === 'wound') { game.newBuild = true; return; }
    try { snapRun(); } catch { /* nothing to keep */ }
    location.replace(`${location.pathname}?v=${m[1]}${location.search.replace(/^\?/, '&').replace(/&v=[^&]*/, '')}`);
  } catch { /* offline: keep playing */ }
}
setTimeout(checkBuild, 4000);
addEventListener('visibilitychange', () => { if (!document.hidden) checkBuild(); });
let SPR, PAL, IMG = {}, WHITE = {}, TINT = {};
async function loadAssets() {
  SPR = await (await fetch(`assets/sprites/sprites.json?v=${BUILD}`)).json();
  PAL = SPR.palette;
  await Promise.all(Object.keys(SPR).filter((k) => k !== 'palette').map((name) => new Promise((ok, fail) => {
    const im = new Image();
    im.onload = () => {
      IMG[name] = im;
      // White silhouettes for the 1-frame hit flash.
      const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
      const x = c.getContext('2d'); x.drawImage(im, 0, 0);
      x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
      WHITE[name] = c;
      // Coloured silhouettes for the rare (blue) and elite (gold) auras.
      if (name.startsWith('mon_') || name === 'risen' || name === 'gravewarden' || name === 'town2') for (const [k, col] of name === 'town2' ? [['black', '#07040b']] : [['blue', '#5ab4ff'], ['gold', '#ffd155'], ['violet', '#b07aff']]) {
        const t = document.createElement('canvas'); t.width = im.width; t.height = im.height;
        const tx = t.getContext('2d'); tx.drawImage(im, 0, 0); tx.globalCompositeOperation = 'source-in'; tx.fillStyle = col; tx.fillRect(0, 0, t.width, t.height);
        (TINT[k] = TINT[k] || {})[name] = t;
      }
      ok();
    };
    im.onerror = fail; im.src = `assets/sprites/${SPR[name].image}?v=${BUILD}`;
  })));
}

// REFORGE spends one Emberstone (every Warden drops them) and turns one stat

// Station you have cleared, for gold.

  { name: 'MYTHIC', p: 1, k: 2.2, col: '#e8383f' },

function snapRun() {
  const R = game.run;

  SAVE.suspend = { seed: R.seed, diff: R.diff, stratum: R.stratum, omens: R.omens, gold: R.gold, level: R.level, xp: R.xp, pending: R.pending, wounds: R.wounds, kills: game.kills,

  game.kills = S.kills || 0; applyGear(true);
  player.x = S.px; player.y = S.py; player.hp = Math.max(1, Math.round(player.maxHp * (S.hpK || 1)));
  if (S.seen && room.seen) { const a = unrle(S.seen, room.seen.length), g = room.fogCtx, RM = room; for (let i = 0; i < a.length; i++) if (a[i]) { RM.seen[i] = 1; const x = i % RM.w, y = (i / RM.w) | 0; if (!RM.baseSolid[i]) { g.fillStyle = PAL.stone2; g.fillRect(x, y, 1, 1); } else if (!RM.baseSolid[i - 1] || !RM.baseSolid[i + 1] || !RM.baseSolid[i - RM.w] || !RM.baseSolid[i + RM.w]) { g.fillStyle = PAL.cloth1; g.fillRect(x, y, 1, 1); } } }

// --------------------------------------------------------- the Ashen Altar ---
// Burn a Hallowed piece on the altar to learn its power for good, then set
// one learned power in each socket: vestments (hood, mantle, gloves,
// girdle, greaves), arms (crossbow, quiver) and relics (pendant, seal,

// only ALTAR_WIN of the time (otherwise the piece is lost); a Chrism, a very rare drop,
// raises the odds.
const ALTAR_SOCKETS = [['vest', 'VESTMENT', ['hood', 'mantle', 'gloves', 'girdle', 'greaves']], ['arms', 'ARMS', ['bow', 'quiver']], ['relic', 'RELIC', ['rosary', 'seal', 'relic']]];

const burnCost = (it) => Math.round(250 * (1 + ((it.il || 1) - 1) * 0.6) / 10) * 10;
// Each failed burn adds ALTAR_PITY to the next, until one succeeds.

function updateTown(dt) {

// The Stations of the Wound (thirty since round 39): the difficulty ladder. The Wound under

const BANDS = [

  { name: 'MARTYR', col: '#ffd155', text: 'RARES AND ELITES HAVE ONE MORE CURSE.' },
  { name: 'SAINT', col: '#ff7a1f', text: 'RARES AND ELITES HAVE TWO MORE CURSES.' },

function wrapW(s, w, small = false) {

function wrap(s, n) {

function chooseTarget() {

  if (player.lock && ok(player.lock)) return player.lock;
