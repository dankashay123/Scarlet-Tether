<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d0a0e">
<title>Hollow Saint</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0a0e; overflow: hidden; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; }
  #rotate { display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
    color: #d9a640; font: 16px Georgia, serif; text-align: center; padding: 24px; background: #0d0a0e; }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="rotate">Turn your device sideways.<br>The Wound is wider than it is tall.</div>
<script>
'use strict';
// Hollow Saint. One file of code; sprite sheets live in assets/sprites/ and
// are generated by tools/sprites.mjs. Design source: docs/GDD.md.

// ------------------------------------------------------------ tuning ---
const T = {
  viewH: 270,                 // target internal height (GDD: about 270 px)
  moveSpeed: 82,
  dash: { charges: 2, recharge: 1.5, iframes: 0.25, time: 0.16, speed: 330, perfectWindow: 0.15 },
  slowmo: { scale: 0.25, time: 0.45 },
  hurtIframes: 0.6,
  crossbow: { range: 160, cooldown: 0.38, speed: 280, dmg: [6, 9], crit: 0.1, pierce: 1 },
  fervor: { decayDelay: 2, decay: 2.5, tiers: ['MURMUR', 'CHANT', 'RAPTURE', 'FRENZY'] },
  wave: { start: 8, max: 30, ramp: 90, eliteEvery: 25, elitesMax: 2, cap: 40 },
};
const ENEMY = {
  risen: { sheet: 'risen', hp: 18, r: 5, speed: 24, reach: 17, windup: 0.45, recover: 0.55, dmg: 8, xp: 3, fervor: 3 },
  gravewarden: { sheet: 'gravewarden', hp: 90, r: 9, speed: 15, reach: 30, windup: 0.6, recover: 0.7, dmg: 16, xp: 15, fervor: 12, elite: true },
};

// ------------------------------------------------------------ display ---
const screen = document.getElementById('screen');
const sctx = screen.getContext('2d');
const buf = document.createElement('canvas');
const ctx = buf.getContext('2d');
const dark = document.createElement('canvas');
const dctx = dark.getContext('2d');
let W = 480, H = 270, SCALE = 1;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const dw = Math.floor(innerWidth * dpr), dh = Math.floor(innerHeight * dpr);
  SCALE = Math.max(1, Math.round(dh / T.viewH));
  W = Math.floor(dw / SCALE); H = Math.floor(dh / SCALE);
  buf.width = dark.width = W; buf.height = dark.height = H;
  screen.width = W * SCALE; screen.height = H * SCALE;
  screen.style.width = (W * SCALE / dpr) + 'px';
  screen.style.height = (H * SCALE / dpr) + 'px';
  screen.style.left = ((innerWidth - W * SCALE / dpr) / 2) + 'px';
  screen.style.top = ((innerHeight - H * SCALE / dpr) / 2) + 'px';
  ctx.imageSmoothingEnabled = sctx.imageSmoothingEnabled = false;
  layoutHud();
}

// ------------------------------------------------------------- assets ---
let SPR, PAL, IMG = {}, WHITE = {};
async function loadAssets() {
  SPR = await (await fetch('assets/sprites/sprites.json')).json();
  PAL = SPR.palette;
  await Promise.all(Object.keys(SPR).filter((k) => k !== 'palette').map((name) => new Promise((ok, fail) => {
    const im = new Image();
    im.onload = () => {
      IMG[name] = im;
      // White silhouettes for the 1-frame hit flash.
      const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
      const x = c.getContext('2d'); x.drawImage(im, 0, 0);
      x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
      WHITE[name] = c; ok();
    };
    im.onerror = fail; im.src = `assets/sprites/${SPR[name].image}`;
  })));
}

function frameOf(sheet, anim, i) { const a = SPR[sheet].anims[anim]; return a[((i % a.length) + a.length) % a.length]; }
// Draw a frame with its anchor at world/screen pixel (x, y).
function spr(sheet, anim, i, x, y, { flip = false, white = false, alpha = 1, ax, ay } = {}) {
  const s = SPR[sheet], f = frameOf(sheet, anim, i);
  const w = f.w ?? s.frameW, h = f.h ?? s.frameH;
  const axx = ax ?? s.anchorX ?? w / 2, ayy = ay ?? s.anchorY ?? h / 2;
  const img = white ? WHITE[sheet] : IMG[sheet];
  if (alpha !== 1) ctx.globalAlpha = alpha;
  x = Math.round(x); y = Math.round(y);
  if (flip) { ctx.save(); ctx.translate(x, 0); ctx.scale(-1, 1); ctx.drawImage(img, f.x, f.y, w, h, -(w - axx), y - ayy, w, h); ctx.restore(); }
  else ctx.drawImage(img, f.x, f.y, w, h, x - axx, y - ayy, w, h);
  if (alpha !== 1) ctx.globalAlpha = 1;
}

// --------------------------------------------------------- pixel font ---
// 3x5 glyphs, rows of 3 bits.
const GLYPHS = {};
(function buildFont() {
  const src = 'A010101111101101B110101110101110C011100100100011D110101101101110E111100110100111F111100110100100G011100101101011H101101111101101I111010010010111J001001001101010K101101110101101L100100100100111M101111111101101N110101101101101O010101101101010P110101110100100Q010101101110011R110101110101101S011100010001110T111010010010010U101101101101111V101101101101010W101101111111101X101101010101101Y101101010010010Z111001010100111' +
    '0111101101101111' + '1010110010010111' + '2110001010100111' + '3110001010001110' + '4101101111001001' + '5111100110001110' + '6011100111101111' + '7111001010010010' + '8111101111101111' + '9111101111001110' +
    '.000000000000010' + ',000000000010100' + '!010010010000010' + '?110001010000010' + ':000010000010000' + "'010010000000000" + '-000000111000000' + '%101001010100101' + '/001001010100100' + '+000010111010000' + '"101101000000000' + ' 000000000000000';
  for (let i = 0; i < src.length; i += 16) GLYPHS[src[i]] = src.slice(i + 1, i + 16);
})();
function textW(s, sc = 1) { return s.length * 4 * sc - sc; }
function text(s, x, y, color, { sc = 1, shadow = PAL.outline, align = 'left' } = {}) {
  s = String(s).toUpperCase();
  if (align === 'center') x -= Math.floor(textW(s, sc) / 2);
  else if (align === 'right') x -= textW(s, sc);
  x = Math.round(x); y = Math.round(y);
  const pass = (ox, oy, c) => {
    ctx.fillStyle = c;
    for (let i = 0; i < s.length; i++) {
      const g = GLYPHS[s[i]] || GLYPHS['?'];
      for (let r = 0; r < 5; r++) for (let q = 0; q < 3; q++)
        if (g[r * 3 + q] === '1') ctx.fillRect(x + i * 4 * sc + q * sc + ox, y + r * sc + oy, sc, sc);
    }
  };
  if (shadow) { pass(-1, 0, shadow); pass(1, 0, shadow); pass(0, -1, shadow); pass(0, 1, shadow); pass(1, 1, shadow); }
  pass(0, 0, color);
}

// -------------------------------------------------------------- input ---
const keys = new Set();
const input = { mx: 0, my: 0, dash: false, execute: false };
const stick = { id: null, ox: 0, oy: 0, x: 0, y: 0, active: false };
const HUD = {};
function layoutHud() {
  HUD.dash = { x: W - 40, y: H - 40, r: 20, icon: 'dash' };
  HUD.m1 = { x: W - 88, y: H - 26, r: 13, icon: 'flask', sealed: true, label: 'HOLY WATER' };
  HUD.m2 = { x: W - 26, y: H - 88, r: 13, icon: 'chain', sealed: true, label: 'CHAIN OF PENITENCE' };
  HUD.pen = { x: W - 80, y: H - 76, r: 15, icon: 'penance', sealed: true, label: 'PENANCE' };
  HUD.exec = { x: W - 128, y: H - 40, r: 14, icon: 'dagger' };
  HUD.pause = { x: W - 14, y: 14, r: 10, icon: 'pause' };
}
function toLocal(cx, cy) {
  const r = screen.getBoundingClientRect();
  return [(cx - r.left) / r.width * W, (cy - r.top) / r.height * H];
}
const hitBtn = (b, x, y, pad = 6) => b && Math.hypot(x - b.x, y - b.y) <= b.r + pad;

function pointerDown(id, cx, cy) {
  const [x, y] = toLocal(cx, cy);
  if (onTap(x, y)) return;
  if (game.state !== 'play') return;
  if (hitBtn(HUD.pause, x, y)) { game.state = 'pause'; return; }
  if (hitBtn(HUD.dash, x, y, 10)) { input.dash = true; HUD.dash.pressed = 0.12; return; }
  if (game.execTarget && hitBtn(HUD.exec, x, y)) { input.execute = true; return; }
  for (const k of ['m1', 'm2', 'pen']) if (hitBtn(HUD[k], x, y)) { toast(`${HUD[k].label}: SEALED BY THE CHOIR`); return; }
  if (x < W * 0.45 && stick.id === null) { Object.assign(stick, { id, ox: x, oy: y, x, y, active: true }); return; }
  // Tap an enemy to lock it (or execute it if it is staggered).
  const wx = x + cam.x, wy = y + cam.y;
  let best = null, bd = 18;
  for (const e of enemies) { if (e.dead || e.state === 'spawn') continue; const d = Math.hypot(e.x - wx, e.y - 8 - wy); if (d < bd) { bd = d; best = e; } }
  if (best && best.state === 'stagger') { input.execute = best; return; }
  player.lock = best && player.lock !== best ? best : null;
}
function pointerMove(id, cx, cy) {
  if (id !== stick.id) return;
  const [x, y] = toLocal(cx, cy);
  stick.x = x; stick.y = y;
  const d = Math.hypot(x - stick.ox, y - stick.oy), max = 26;
  if (d > max) { stick.ox = x - (x - stick.ox) / d * max; stick.oy = y - (y - stick.oy) / d * max; } // the base follows the thumb
}
function pointerUp(id) { if (id === stick.id) { stick.id = null; stick.active = false; } }

screen.addEventListener('touchstart', (e) => { e.preventDefault(); for (const t of e.changedTouches) pointerDown(t.identifier, t.clientX, t.clientY); }, { passive: false });
screen.addEventListener('touchmove', (e) => { e.preventDefault(); for (const t of e.changedTouches) pointerMove(t.identifier, t.clientX, t.clientY); }, { passive: false });
screen.addEventListener('touchend', (e) => { e.preventDefault(); for (const t of e.changedTouches) pointerUp(t.identifier); }, { passive: false });
screen.addEventListener('touchcancel', (e) => { for (const t of e.changedTouches) pointerUp(t.identifier); });
screen.addEventListener('mousedown', (e) => pointerDown('m', e.clientX, e.clientY));
addEventListener('mousemove', (e) => { if (stick.id === 'm') pointerMove('m', e.clientX, e.clientY); });
addEventListener('mouseup', () => pointerUp('m'));
addEventListener('keydown', (e) => {
  keys.add(e.code);
  if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'KeyK') input.dash = true;
  if (e.code === 'KeyE' || e.code === 'KeyJ') input.execute = true;
  if (e.code === 'Escape' || e.code === 'KeyP') { if (game.state === 'play') game.state = 'pause'; else if (game.state === 'pause') game.state = 'play'; }
  if (e.code === 'Enter' || e.code === 'Space') onTap(-1, -1);
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => { keys.clear(); if (game.state === 'play') game.state = 'pause'; });
document.addEventListener('visibilitychange', () => { if (document.hidden && game.state === 'play') game.state = 'pause'; });

function readMove() {
  let x = 0, y = 0;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) x -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) x += 1;
  if (keys.has('KeyW') || keys.has('ArrowUp')) y -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) y += 1;
  if (stick.active) {
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy, d = Math.hypot(dx, dy);
    if (d > 3) { const m = Math.min(1, d / 22); x = dx / d * m; y = dy / d * m; }
  }
  const d = Math.hypot(x, y);
  if (d > 1) { x /= d; y /= d; }
  input.mx = x; input.my = y;
}

// --------------------------------------------------------------- world ---
const TILE = 16;
let room, cam = { x: 0, y: 0 }, stain, sctxStain, roomCanvas;
let rng = Math.random;
const rand = (a, b) => a + rng() * (b - a);
const pick = (a) => a[Math.floor(rng() * a.length)];

function makeRoom() {
  const w = 46, h = 28;
  const solid = [];
  for (let y = 0; y < h; y++) { solid.push([]); for (let x = 0; x < w; x++) solid[y].push(y < 2 || y >= h - 1 || x < 1 || x >= w - 1); }
  // Pillars (2x2: a cap over a face), kept clear of the centre and each other.
  const pillars = [];
  for (let tries = 0; pillars.length < 9 && tries < 300; tries++) {
    const px = Math.floor(rand(4, w - 6)), py = Math.floor(rand(5, h - 5));
    if (Math.abs(px - w / 2) < 5 && Math.abs(py - h / 2) < 4) continue;
    if (pillars.some((p) => Math.abs(p.x - px) < 7 && Math.abs(p.y - py) < 6)) continue;
    pillars.push({ x: px, y: py });
    for (let yy = 0; yy < 2; yy++) for (let xx = 0; xx < 2; xx++) solid[py + yy][px + xx] = true;
  }
  const isSolid = (x, y) => x < 0 || y < 0 || x >= w || y >= h || solid[y][x];
  // Bake tiles.
  roomCanvas = document.createElement('canvas'); roomCanvas.width = w * TILE; roomCanvas.height = h * TILE;
  const rc = roomCanvas.getContext('2d');
  const t = SPR.tiles.anims, I = IMG.tiles;
  const candles = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let f;
    if (!isSolid(x, y)) { const n = rng(); f = t.floor[n < 0.72 ? 0 : n < 0.82 ? 1 : n < 0.91 ? 2 : 3]; }
    else if (!isSolid(x, y + 1)) f = t.wall[2];       // face
    else if (y + 2 < h && !isSolid(x, y + 2) && isSolid(x, y + 1)) f = t.wall[1]; // cap
    else f = t.wall[0];                                 // top
    rc.drawImage(I, f.x, f.y, 16, 16, x * TILE, y * TILE, 16, 16);
    // Soft shadow on floor under a wall face.
    if (!isSolid(x, y) && isSolid(x, y - 1)) { rc.fillStyle = 'rgba(13,10,14,0.45)'; rc.fillRect(x * TILE, y * TILE, 16, 3); }
    if (isSolid(x, y) && !isSolid(x, y + 1) && y === 1 && x % 5 === 2) candles.push({ x: x * TILE + 8, y: y * TILE + 13, ph: rng() * 10 });
  }
  for (const p of pillars) candles.push({ x: p.x * TILE + 16, y: (p.y + 1) * TILE + 13, ph: rng() * 10 });
  stain = document.createElement('canvas'); stain.width = roomCanvas.width; stain.height = roomCanvas.height;
  sctxStain = stain.getContext('2d');
  room = { w, h, solid, isSolid, candles, pw: w * TILE, ph: h * TILE };
}

const solidAt = (px, py) => room.isSolid(Math.floor(px / TILE), Math.floor(py / TILE));
// Move a circle, sliding along walls. Returns true if it bumped.
function moveCircle(o, dx, dy, r) {
  let bumped = false;
  const tryAxis = (ax, d) => {
    if (!d) return;
    const nx = o.x + (ax === 'x' ? d : 0), ny = o.y + (ax === 'y' ? d : 0);
    if (solidAt(nx - r, ny - r) || solidAt(nx + r, ny - r) || solidAt(nx - r, ny + r) || solidAt(nx + r, ny + r)) { bumped = true; return; }
    o.x = nx; o.y = ny;
  };
  const steps = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 4) || 1;
  for (let i = 0; i < steps; i++) { tryAxis('x', dx / steps); tryAxis('y', dy / steps); }
  return bumped;
}

// --------------------------------------------------------------- state ---
const game = { state: 'title', time: 0, real: 0, timeScale: 1, slowmo: 0, hitstop: 0, shake: 0, kills: 0, fervor: 0, fervorT: 0, best: 0, perfects: 0, toast: null, execTarget: null, flash: 0 };
let player, enemies = [], bolts = [], parts = [], gibs = [], nums = [], ghosts = [], rings = [];
let director;

function newRun() {
  makeRoom();
  player = {
    x: room.pw / 2, y: room.ph / 2, r: 5, hp: 100, maxHp: 100, face: 1,
    charges: T.dash.charges, recharge: 0, dashT: 0, dashStart: -9, dashDx: 1, dashDy: 0, iframes: 0, perfectUsed: false,
    fireCd: 0.6, lock: null, target: null, anim: 'idle', animT: 0, hurt: 0, ghostT: 0,
  };
  enemies = []; bolts = []; parts = []; gibs = []; nums = []; ghosts = []; rings = [];
  Object.assign(game, { time: 0, timeScale: 1, slowmo: 0, hitstop: 0, shake: 0, kills: 0, fervor: 0, fervorT: 0, best: 0, perfects: 0, execTarget: null, flash: 0, runStart: 0 });
  director = { t: 0, eliteT: 12 };
}

function toast(msg, t = 2) { game.toast = { msg, t }; }
const fervorTier = () => Math.min(3, Math.floor(game.fervor / 25));
function addFervor(n) { game.fervor = Math.min(100, game.fervor + n); game.fervorT = 0; game.best = Math.max(game.best, game.fervor); }

// --------------------------------------------------------------- enemies ---
function spawnEnemy(type) {
  const def = ENEMY[type];
  for (let i = 0; i < 40; i++) {
    const x = rand(TILE * 2, room.pw - TILE * 2), y = rand(TILE * 3, room.ph - TILE * 2);
    const d = Math.hypot(x - player.x, y - player.y);
    if (d < 90 || d > 260) continue;
    if (solidAt(x - 10, y - 10) || solidAt(x + 10, y + 10) || solidAt(x + 10, y - 10) || solidAt(x - 10, y + 10)) continue;
    enemies.push({ type, def, x, y, hp: def.hp, maxHp: def.hp, r: def.r, state: 'spawn', t: 0, animT: rng(), face: x < player.x ? 1 : -1, flash: 0, kx: 0, ky: 0, elite: !!def.elite, staggered: false, hitDone: false });
    return;
  }
}

function updateDirector(dt) {
  director.t += dt;
  const alive = enemies.filter((e) => !e.dead);
  const want = Math.min(T.wave.max, Math.round(T.wave.start + (T.wave.max - T.wave.start) * Math.min(1, director.t / T.wave.ramp)));
  const fodder = alive.filter((e) => !e.elite).length;
  if (fodder < want && alive.length < T.wave.cap && rng() < dt * 6) spawnEnemy('risen');
  director.eliteT -= dt;
  if (director.eliteT <= 0) {
    director.eliteT = T.wave.eliteEvery;
    if (alive.filter((e) => e.elite).length < T.wave.elitesMax) spawnEnemy('gravewarden');
  }
}

function updateEnemy(e, dt) {
  const d = e.def;
  e.t += dt; e.animT += dt; e.flash = Math.max(0, e.flash - dt);
  // Knockback.
  if (e.kx || e.ky) { moveCircle(e, e.kx * dt, e.ky * dt, e.r); e.kx *= Math.pow(0.001, dt); e.ky *= Math.pow(0.001, dt); if (Math.abs(e.kx) + Math.abs(e.ky) < 2) e.kx = e.ky = 0; }
  const dx = player.x - e.x, dy = player.y - e.y, dist = Math.hypot(dx, dy) || 1;
  switch (e.state) {
    case 'spawn': if (e.t > (e.elite ? 1.2 : 0.8)) { e.state = 'walk'; e.t = 0; } return;
    case 'walk': {
      e.face = dx < 0 ? -1 : 1;
      let vx = dx / dist * d.speed, vy = dy / dist * d.speed;
      // Separation so the horde spreads instead of stacking.
      for (const o of enemies) {
        if (o === e || o.dead || o.state === 'spawn') continue;
        const ox = e.x - o.x, oy = e.y - o.y, od = Math.hypot(ox, oy), min = e.r + o.r + 3;
        if (od > 0 && od < min) { vx += ox / od * 40 * (1 - od / min) * 2; vy += oy / od * 40 * (1 - od / min) * 2; }
      }
      moveCircle(e, vx * dt, vy * dt, e.r);
      if (dist < d.reach * 0.85) { e.state = 'windup'; e.t = 0; e.hitDone = false; }
      break;
    }
    case 'windup':
      if (e.t >= d.windup) { e.state = 'strike'; e.t = 0; e.sx = e.x; e.sy = e.y; if (!e.elite) resolveStrike(e); }
      break;
    case 'strike':
      if (e.elite) { // shield-bash lunge
        moveCircle(e, e.face * 150 * dt, 0, e.r);
        if (!e.hitDone && Math.abs(player.x - (e.x + e.face * 10)) < 14 && Math.abs(player.y - e.y) < 12) { e.hitDone = true; damagePlayer(e, d.dmg, [[player.x, player.y]]); }
        if (e.t > 0.22) { e.state = 'recover'; e.t = 0; }
      } else if (e.t > 0.12) { e.state = 'recover'; e.t = 0; }
      break;
    case 'recover': if (e.t > d.recover) { e.state = 'walk'; e.t = 0; } break;
    case 'stagger':
      if (e.t > 3) { e.state = 'walk'; e.t = 0; }
      break;
  }
}

function resolveStrike(e) {
  // The Risen claws the space in front of it. The check also covers where the
  // Saint dashed from, so dashing away at the last instant still counts as a
  // perfect dodge.
  const hx = e.x + e.face * 9, hy = e.y - 2;
  const near = (x, y) => Math.hypot(x - hx, y - hy) < 11;
  damagePlayer(e, e.def.dmg, [[player.x, player.y], [player.dashX ?? player.x, player.dashY ?? player.y]].filter(([x, y]) => near(x, y)));
}

function damagePlayer(src, dmg, contacts) {
  if (!contacts.length) return;
  const dashing = game.time - player.dashStart <= T.dash.iframes;
  if (dashing && game.time - player.dashStart <= T.dash.perfectWindow + 0.05 && !player.perfectUsed) { perfectDodge(src); return; }
  if (player.iframes > 0) return;
  const [cx, cy] = contacts[0];
  if (Math.hypot(cx - player.x, cy - player.y) > 1) return; // only the dash-origin was in reach: a plain miss
  player.hp -= dmg; player.iframes = T.hurtIframes; player.hurt = 0.3;
  game.shake = Math.max(game.shake, 4); game.hitstop = 0.05;
  game.fervor = Math.max(0, game.fervor - 8);
  bleed(player.x, player.y - 10, 5, src.x < player.x ? 1 : -1);
  nums.push({ x: player.x, y: player.y - 30, v: dmg, t: 0, color: PAL.blood0, crit: false });
  if (player.hp <= 0) { player.hp = 0; die(); }
}

function perfectDodge(src) {
  player.perfectUsed = true; game.perfects++;
  game.slowmo = T.slowmo.time; game.flash = 0.12;
  addFervor(15);
  rings.push({ x: player.x, y: player.y - 12, t: 0, max: 0.4, r: 40, color: PAL.gold0 });
  nums.push({ x: player.x, y: player.y - 34, v: 'PERFECT', t: 0, color: PAL.gold0, crit: true });
}

function hurtEnemy(e, dmg, crit, dirx, diry, kb = 60) {
  if (e.dead) return;
  // Gravewarden: the tower shield takes most of a frontal hit.
  let blocked = false;
  if (e.elite && e.state !== 'stagger' && Math.sign(dirx) === -e.face && Math.abs(dirx) > Math.abs(diry) * 0.6) { dmg = Math.max(1, Math.round(dmg * 0.35)); blocked = true; crit = false; }
  dmg = Math.round(dmg * (1 + fervorTier() * 0.1));
  e.hp -= dmg; e.flash = 0.05;
  if (!e.elite || !blocked) { e.kx += dirx * kb * (e.elite ? 0.2 : 1); e.ky += diry * kb * (e.elite ? 0.2 : 1); }
  nums.push({ x: e.x + rand(-4, 4), y: e.y - (e.elite ? 30 : 20), v: dmg, t: 0, color: blocked ? PAL.iron0 : crit ? PAL.gold0 : PAL.bone0, crit });
  if (blocked) sparks(e.x + e.face * 10, e.y - 12, PAL.gold0, 4);
  else bleed(e.x, e.y - 8, crit ? 4 : 2, dirx);
  if (e.elite && !e.staggered && e.hp > 0 && e.hp <= e.maxHp * 0.15) { e.staggered = true; e.state = 'stagger'; e.t = 0; toast('STAGGERED: EXECUTE IT', 1.5); }
  if (e.hp <= 0) killEnemy(e, dirx, diry);
}

function killEnemy(e, dirx, diry, executed = false) {
  e.dead = true; game.kills++;
  if (player.lock === e) player.lock = null;
  addFervor(e.def.fervor + 1); // +1 for the gore
  game.shake = Math.max(game.shake, e.elite ? 5 : 1.5);
  game.hitstop = Math.max(game.hitstop, e.elite ? 0.07 : 0.025);
  dismember(e, dirx, diry, executed);
}

// ---------------------------------------------------------------- gore ---
function bleed(x, y, n, dir) {
  for (let i = 0; i < n; i++) parts.push({ kind: 'blood', x, y, z: 6, vx: dir * rand(10, 70) + rand(-20, 20), vy: rand(-30, 30), vz: rand(10, 60), c: pick([PAL.blood0, PAL.blood1, PAL.blood1, PAL.blood2]), s: rng() < 0.3 ? 2 : 1 });
}
function sparks(x, y, c, n) {
  for (let i = 0; i < n; i++) parts.push({ kind: 'spark', x, y, z: 0, vx: rand(-80, 80), vy: rand(-80, 80), vz: 0, c, life: rand(0.1, 0.3) });
}
function dismember(e, dirx, diry, executed) {
  const n = e.elite ? 4 : 2 + Math.floor(rng() * 3);
  const kinds = [0, 1, 2, 3].sort(() => rng() - 0.5).slice(0, n);
  for (const k of kinds) gibs.push({ anim: e.elite ? 'wardenGib' : 'gib', i: k, x: e.x, y: e.y - 6, z: 8, vx: dirx * rand(30, 90) + rand(-40, 40), vy: diry * rand(30, 90) + rand(-40, 40), vz: rand(40, 110), rot: 0, settled: false, t: 0 });
  bleed(e.x, e.y - 8, executed ? 30 : e.elite ? 22 : 12, dirx);
  // A splat that stains the floor for the rest of the room.
  splat(e.x, e.y, e.elite ? 9 : 6);
}
function splat(x, y, r) {
  const c = sctxStain;
  for (let i = 0; i < r * 3; i++) {
    const a = rng() * Math.PI * 2, d = Math.pow(rng(), 0.7) * r;
    c.fillStyle = d < r * 0.5 ? PAL.blood2 : pick([PAL.blood2, PAL.blood3]);
    const s = rng() < 0.4 ? 2 : 1;
    c.fillRect(Math.round(x + Math.cos(a) * d), Math.round(y + Math.sin(a) * d * 0.6), s, s);
  }
}

function updateParts(dt) {
  for (const p of parts) {
    if (p.kind === 'spark') { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; p.life -= dt; continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vz -= 260 * dt; p.z += p.vz * dt;
    if (p.z <= 0) { // landed: stain the floor
      sctxStain.fillStyle = p.c; sctxStain.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
      if (p.s === 2 && rng() < 0.5) sctxStain.fillRect(Math.round(p.x + Math.sign(p.vx)), Math.round(p.y), 2, 1);
      p.life = -1;
    }
  }
  parts = parts.filter((p) => (p.life ?? 1) > 0);
  for (const g of gibs) {
    if (g.settled) continue;
    g.t += dt;
    g.vz -= 300 * dt; g.z += g.vz * dt;
    const bx = g.x;
    moveCircle(g, g.vx * dt, g.vy * dt, 2);
    if (bx === g.x && g.vx) g.vx *= -0.5;
    if (g.z <= 0) {
      g.z = 0;
      if (Math.abs(g.vz) > 30) { g.vz = -g.vz * 0.4; g.vx *= 0.6; g.vy *= 0.6; sctxStain.fillStyle = PAL.blood2; sctxStain.fillRect(Math.round(g.x), Math.round(g.y), 2, 1); }
      else { g.vz = 0; g.vx *= 0.8; g.vy *= 0.8; }
      if (Math.abs(g.vx) + Math.abs(g.vy) < 4 && g.vz === 0) {
        g.settled = true; // bake into the floor stain
        const f = frameOf('fx', g.anim, g.i);
        sctxStain.drawImage(IMG.fx, f.x, f.y, 8, 8, Math.round(g.x - 4), Math.round(g.y - 4), 8, 8);
      }
    }
    if (rng() < dt * 20 && g.z > 1) parts.push({ kind: 'blood', x: g.x, y: g.y, z: g.z, vx: 0, vy: 0, vz: 0, c: PAL.blood1, s: 1 });
  }
  gibs = gibs.filter((g) => !g.settled);
}

// -------------------------------------------------------------- weapons ---
function chooseTarget() {
  const R = T.crossbow.range;
  const ok = (e) => !e.dead && e.state !== 'spawn' && Math.hypot(e.x - player.x, e.y - player.y) <= R;
  if (player.lock && ok(player.lock)) return player.lock;
  let best = null, bd = Infinity;
  for (const e of enemies) {
    if (!ok(e)) continue;
    // Priority: elites first, then nearest.
    const d = Math.hypot(e.x - player.x, e.y - player.y) - (e.elite ? 10000 : 0);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function updateCrossbow(dt) {
  player.fireCd -= dt;
  player.target = chooseTarget();
  if (!player.target || player.fireCd > 0) return;
  player.fireCd = T.crossbow.cooldown;
  const t = player.target;
  const sx = player.x + player.face * 8, sy = player.y - 13;
  const tx = t.x + t.kx * 0.05, ty = t.y - (t.elite ? 14 : 9);
  const d = Math.hypot(tx - sx, ty - sy) || 1;
  const crit = rng() < T.crossbow.crit;
  bolts.push({ x: sx, y: sy, vx: (tx - sx) / d * T.crossbow.speed, vy: (ty - sy) / d * T.crossbow.speed, life: 0.8, pierce: T.crossbow.pierce, hit: new Set(), crit });
  player.face = tx < player.x ? -1 : 1;
}

function updateBolts(dt) {
  for (const b of bolts) {
    b.life -= dt;
    const steps = 3;
    for (let s = 0; s < steps && b.life > 0; s++) {
      b.x += b.vx * dt / steps; b.y += b.vy * dt / steps;
      if (solidAt(b.x, b.y + 8)) { b.life = 0; sparks(b.x, b.y, PAL.iron0, 3); break; }
      for (const e of enemies) {
        if (e.dead || e.state === 'spawn' || b.hit.has(e)) continue;
        const hy = e.y - (e.elite ? 14 : 9), hr = e.elite ? 11 : 7;
        if (Math.abs(b.x - e.x) < hr && Math.abs(b.y - hy) < hr + 2) {
          b.hit.add(e);
          const sp = Math.hypot(b.vx, b.vy);
          const [lo, hi] = T.crossbow.dmg;
          hurtEnemy(e, Math.round(rand(lo, hi + 1) * (b.crit ? 2 : 1)), b.crit, b.vx / sp, b.vy / sp);
          if (b.pierce-- <= 0) { b.life = 0; break; }
        }
      }
    }
  }
  bolts = bolts.filter((b) => b.life > 0);
}

// --------------------------------------------------------------- player ---
function updatePlayer(dt) {
  const p = player;
  p.iframes = Math.max(0, p.iframes - dt); p.hurt = Math.max(0, p.hurt - dt);
  // Dash charges recharge one at a time.
  if (p.charges < T.dash.charges) { p.recharge += dt; if (p.recharge >= T.dash.recharge) { p.recharge = 0; p.charges++; } }
  if (input.dash) {
    input.dash = false;
    if (p.charges > 0 && p.dashT <= 0) {
      p.charges--;
      let dx = input.mx, dy = input.my;
      if (Math.hypot(dx, dy) < 0.2) { dx = p.face; dy = 0; }
      const d = Math.hypot(dx, dy); p.dashDx = dx / d; p.dashDy = dy / d;
      p.dashT = T.dash.time; p.dashStart = game.time; p.dashX = p.x; p.dashY = p.y;
      p.iframes = Math.max(p.iframes, T.dash.iframes); p.perfectUsed = false;
      if (Math.abs(dx) > 0.1) p.face = Math.sign(dx);
      for (let i = 0; i < 4; i++) parts.push({ kind: 'spark', x: p.x + rand(-4, 4), y: p.y, z: 0, vx: -p.dashDx * rand(20, 60), vy: rand(-10, 10), vz: 0, c: PAL.stone1, life: 0.25 });
    }
  }
  // Execute a staggered elite.
  game.execTarget = enemies.find((e) => !e.dead && e.state === 'stagger' && Math.hypot(e.x - p.x, e.y - p.y) < 90) || null;
  if (input.execute) {
    const t = input.execute === true ? game.execTarget : input.execute;
    input.execute = false;
    if (t && !t.dead && t.state === 'stagger') execute(t);
  }
  let vx, vy;
  if (p.dashT > 0) {
    p.dashT -= dt; vx = p.dashDx * T.dash.speed; vy = p.dashDy * T.dash.speed;
    p.ghostT -= dt;
    if (p.ghostT <= 0) { p.ghostT = 0.025; ghosts.push({ x: p.x, y: p.y, face: p.face, i: Math.floor((T.dash.time - p.dashT) / T.dash.time * 3), t: 0 }); }
    p.anim = 'dash';
  } else {
    vx = input.mx * T.moveSpeed; vy = input.my * T.moveSpeed;
    p.anim = Math.hypot(vx, vy) > 5 ? 'run' : 'idle';
    if (!p.target && Math.abs(input.mx) > 0.15) p.face = Math.sign(input.mx);
  }
  moveCircle(p, vx * dt, vy * dt, p.r);
  p.animT += dt;
  if (p.dashT <= 0 && game.time - p.dashStart > 0.3) { p.dashX = undefined; p.dashY = undefined; }
}

function execute(e) {
  const p = player;
  // The Saint lunges to the elite's side; a heavy hit-pause sells the blow.
  const side = p.x < e.x ? -1 : 1;
  p.x = e.x + side * 14; p.y = e.y; moveCircle(p, 0, 0, p.r);
  p.face = -side; p.iframes = Math.max(p.iframes, 0.5);
  game.hitstop = 0.18; game.shake = 8; game.flash = 0.08;
  p.hp = Math.min(p.maxHp, p.hp + Math.round(p.maxHp * 0.05));
  addFervor(20);
  nums.push({ x: e.x, y: e.y - 40, v: 'EXECUTED', t: 0, color: PAL.blood0, crit: true });
  killEnemy(e, -side, 0, true);
}

function die() {
  game.state = 'dead'; game.deathT = 0;
  game.receipt = { kills: game.kills, fervor: Math.round(game.best), perfects: game.perfects, time: game.time };
}

// --------------------------------------------------------------- update ---
function update(realDt) {
  game.real += realDt;
  if (game.toast) { game.toast.t -= realDt; if (game.toast.t <= 0) game.toast = null; }
  if (HUD.dash.pressed) HUD.dash.pressed = Math.max(0, HUD.dash.pressed - realDt);
  if (game.state === 'dead') { game.deathT += realDt; }
  if (game.state !== 'play') return;
  readMove();
  game.flash = Math.max(0, game.flash - realDt);
  game.shake = Math.max(0, game.shake - realDt * 20);
  if (game.hitstop > 0) { game.hitstop -= realDt; return; }
  if (game.slowmo > 0) { game.slowmo -= realDt; game.timeScale = T.slowmo.scale; } else game.timeScale = 1;
  const dt = realDt * game.timeScale;
  game.time += dt;
  // Fervor decays after a short grace.
  game.fervorT += dt;
  if (game.fervorT > T.fervor.decayDelay) game.fervor = Math.max(0, game.fervor - T.fervor.decay * dt);

  updatePlayer(dt);
  updateCrossbow(dt);
  updateDirector(dt);
  for (const e of enemies) if (!e.dead) updateEnemy(e, dt);
  enemies = enemies.filter((e) => !e.dead);
  updateBolts(dt);
  updateParts(dt);
  for (const g of ghosts) g.t += realDt;
  ghosts = ghosts.filter((g) => g.t < 0.2);
  for (const r of rings) r.t += realDt;
  rings = rings.filter((r) => r.t < r.max);
  for (const n of nums) n.t += realDt;
  nums = nums.filter((n) => n.t < 0.8);

  // Camera: centre on the Saint, clamped to the room.
  const tx = player.x - W / 2, ty = player.y - 10 - H / 2;
  cam.x = room.pw <= W ? (room.pw - W) / 2 : Math.max(0, Math.min(room.pw - W, tx));
  cam.y = room.ph <= H ? (room.ph - H) / 2 : Math.max(0, Math.min(room.ph - H, ty));
}

// --------------------------------------------------------------- render ---
function render() {
  ctx.fillStyle = PAL.outline; ctx.fillRect(0, 0, W, H);
  if (game.state === 'title' || !player) { renderTitle(); blit(); return; }
  const sx = game.shake ? Math.round(rand(-game.shake, game.shake)) : 0, sy = game.shake ? Math.round(rand(-game.shake, game.shake)) : 0;
  const cx = Math.round(cam.x) + sx, cy = Math.round(cam.y) + sy;
  ctx.save(); ctx.translate(-cx, -cy);
  ctx.drawImage(roomCanvas, 0, 0); ctx.drawImage(stain, 0, 0);
  // Wall candles.
  for (const c of room.candles) spr('fx', 'candle', Math.floor(game.real * 8 + c.ph), c.x, c.y, { ax: 4, ay: 13 });
  // Spawn mounds.
  for (const e of enemies) if (e.state === 'spawn') spr('fx', 'mound', Math.min(2, Math.floor(e.t / (e.elite ? 0.4 : 0.27))), e.x, e.y, { ax: 8, ay: 7 });
  // Shadows.
  ctx.fillStyle = 'rgba(13,10,14,0.5)';
  const shadow = (x, y, rx) => { ctx.beginPath(); ctx.ellipse(Math.round(x), Math.round(y), rx, rx * 0.4, 0, 0, Math.PI * 2); ctx.fill(); };
  for (const e of enemies) if (e.state !== 'spawn') shadow(e.x, e.y, e.elite ? 10 : 6);
  shadow(player.x, player.y, 7);
  for (const g of gibs) shadow(g.x, g.y, 2);
  // Dash afterimages.
  for (const g of ghosts) spr('saint', 'dash', g.i, g.x, g.y, { flip: g.face < 0, white: true, alpha: 0.5 * (1 - g.t / 0.2) });
  // Y-sorted actors.
  const actors = enemies.filter((e) => e.state !== 'spawn').concat([player]).sort((a, b) => a.y - b.y);
  for (const a of actors) a === player ? drawPlayer() : drawEnemy(a);
  // Gibs in flight and blood droplets.
  for (const g of gibs) spr('fx', g.anim, g.i, g.x, g.y - g.z, { ax: 4, ay: 4 });
  for (const p of parts) { ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y - p.z), p.s || 1, p.s || 1); }
  // Bolts.
  for (const b of bolts) {
    const f = frameOf('fx', 'bolt', 0);
    ctx.save(); ctx.translate(Math.round(b.x), Math.round(b.y)); ctx.rotate(Math.atan2(b.vy, b.vx));
    ctx.drawImage(IMG.fx, f.x, f.y, 12, 5, -6, -2, 12, 5); ctx.restore();
  }
  // Target markers.
  if (player.target) drawMarker(player.target, player.lock === player.target);
  ctx.restore();

  renderLight(cx, cy);

  // Additive glow (VFX layer).
  ctx.save(); ctx.translate(-cx, -cy); ctx.globalCompositeOperation = 'lighter';
  for (const c of room.candles) glow(c.x, c.y - 8, 26 + Math.sin(game.real * 9 + c.ph) * 2, 'rgba(127,214,122,0.16)');
  glow(player.x, player.y - 30, 14, 'rgba(255,224,138,0.18)');
  for (const b of bolts) glow(b.x, b.y, b.crit ? 12 : 8, b.crit ? 'rgba(255,224,138,0.5)' : 'rgba(255,246,208,0.3)');
  for (const p of parts) if (p.kind === 'spark') glow(p.x, p.y, 4, 'rgba(255,224,138,0.4)');
  for (const r of rings) { const k = r.t / r.max; ctx.strokeStyle = `rgba(255,224,138,${0.9 * (1 - k)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(r.x, r.y, 6 + r.r * k, 0, Math.PI * 2); ctx.stroke(); }
  ctx.restore();

  // Damage numbers.
  for (const n of nums) {
    const k = n.t / 0.8, rise = 14 * Math.min(1, n.t * 5) + n.t * 6;
    const sc = n.crit ? 2 : 1;
    text(String(n.v), n.x - cx, n.y - cy - rise - (n.crit ? 4 : 0), n.color, { sc, align: 'center' });
    void k;
  }
  renderScreenFx();
  renderHud();
  if (game.state === 'pause') overlay('PAUSED', 'TAP TO RESUME');
  if (game.state === 'dead') renderReceipt();
  blit();
}

function glow(x, y, r, c) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, c); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

function renderLight(cx, cy) {
  // Darkness overlay with light radii cut out (GDD: darkness per Stratum,
  // candle light radii). Undercroft darkness is cold and heavy.
  dctx.globalCompositeOperation = 'source-over';
  dctx.fillStyle = 'rgba(8,6,12,0.72)'; dctx.fillRect(0, 0, W, H);
  dctx.globalCompositeOperation = 'destination-out';
  const hole = (x, y, r, a = 1) => {
    const g = dctx.createRadialGradient(x - cx, y - cy, r * 0.2, x - cx, y - cy, r);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(0.6, `rgba(0,0,0,${a * 0.6})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = g; dctx.fillRect(x - cx - r, y - cy - r, r * 2, r * 2);
  };
  hole(player.x, player.y - 12, 110 + fervorTier() * 6);
  for (const c of room.candles) hole(c.x, c.y - 6, 62 + Math.sin(game.real * 7 + c.ph) * 3, 0.85);
  for (const b of bolts) hole(b.x, b.y, 22, 0.5);
  dctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(dark, 0, 0);
}

function drawPlayer() {
  const p = player;
  const fps = p.anim === 'dash' ? 18 : p.anim === 'run' ? 12 : 5;
  let i = Math.floor(p.animT * fps);
  if (p.anim === 'dash') i = Math.min(2, Math.floor((T.dash.time - p.dashT) / T.dash.time * 3));
  const blink = p.iframes > 0 && p.hurt > 0 && Math.floor(game.real * 30) % 2 === 0;
  spr('saint', p.anim, i, p.x, p.y, { flip: p.face < 0, white: p.hurt > 0.25 || blink });
}

function drawEnemy(e) {
  const flip = e.face < 0;
  let anim = 'walk', i = Math.floor(e.animT * (e.elite ? 6 : 8));
  if (e.state === 'windup') { anim = 'attack'; i = e.t < e.def.windup / 2 ? 0 : 1; }
  else if (e.state === 'strike') { anim = 'attack'; i = 2; }
  else if (e.state === 'recover') { anim = 'attack'; i = e.t < 0.15 ? 2 : 3; }
  else if (e.state === 'stagger') { anim = 'attack'; i = 3; }
  // Windup telegraph: flash white on the beat before the hit.
  const tele = e.state === 'windup' && e.t > e.def.windup - 0.18 && Math.floor(game.real * 24) % 2 === 0;
  const shake = e.state === 'stagger' ? Math.round(Math.sin(game.real * 60)) : 0;
  spr(e.def.sheet, anim, i, e.x + shake, e.y, { flip, white: e.flash > 0 || tele });
  if (e.elite) { // elite HP pip bar
    const w = 22, x = Math.round(e.x - w / 2), y = Math.round(e.y - 36);
    ctx.fillStyle = PAL.outline; ctx.fillRect(x - 1, y - 1, w + 2, 4);
    ctx.fillStyle = PAL.blood2; ctx.fillRect(x, y, w, 2);
    ctx.fillStyle = e.state === 'stagger' ? PAL.gold0 : PAL.blood0; ctx.fillRect(x, y, Math.max(0, Math.round(w * e.hp / e.maxHp)), 2);
  }
  if (e.state === 'stagger') spr('fx', 'dagger', 0, e.x, e.y - 40 + Math.round(Math.sin(game.real * 8) * 2), { ax: 4, ay: 11 });
}

function drawMarker(e, locked) {
  const h = e.elite ? 30 : 20, w = e.elite ? 22 : 14;
  const x = Math.round(e.x - w / 2), y = Math.round(e.y - h - 2), s = locked ? 4 : 3;
  const pulse = locked ? Math.round(Math.sin(game.real * 10)) : 0;
  ctx.fillStyle = locked ? PAL.gold0 : 'rgba(217,166,64,0.55)';
  for (const [cx, cy, dx, dy] of [[x - pulse, y - pulse, 1, 1], [x + w + pulse, y - pulse, -1, 1], [x - pulse, y + h + pulse, 1, -1], [x + w + pulse, y + h + pulse, -1, -1]]) {
    ctx.fillRect(dx > 0 ? cx : cx - s + 1, cy, s, 1);
    ctx.fillRect(cx, dy > 0 ? cy : cy - s + 1, 1, s);
  }
}

function renderScreenFx() {
  // Fervor tint: screen edges shift ember -> crimson -> white-gold.
  const tier = fervorTier();
  const tints = [null, 'rgba(255,138,42,', 'rgba(168,28,34,', 'rgba(255,224,138,'];
  if (tints[tier]) edge(tints[tier], 0.16 + 0.05 * Math.sin(game.real * 4));
  if (player.hurt > 0) edge('rgba(224,56,58,', player.hurt * 1.5);
  if (game.slowmo > 0) { ctx.fillStyle = 'rgba(200,240,255,0.08)'; ctx.fillRect(0, 0, W, H); }
  if (game.flash > 0) { ctx.fillStyle = `rgba(255,246,208,${game.flash * 3})`; ctx.fillRect(0, 0, W, H); }
}
function edge(rgb, a) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.62);
  g.addColorStop(0, rgb + '0)'); g.addColorStop(1, rgb + Math.max(0, Math.min(1, a)) + ')');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ----------------------------------------------------------------- HUD ---
function frameBox(x, y, w, h) { // gilded pixel frame
  ctx.fillStyle = PAL.outline; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = PAL.gold2; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = PAL.gold1; ctx.fillRect(x - 1, y - 1, w + 2, 1); ctx.fillRect(x - 1, y - 1, 1, h + 2);
  ctx.fillStyle = PAL.void; ctx.fillRect(x, y, w, h);
}
function bar(x, y, w, h, k, fill, back, hi) {
  frameBox(x, y, w, h);
  ctx.fillStyle = back; ctx.fillRect(x, y, w, h);
  const fw = Math.round(w * Math.max(0, Math.min(1, k)));
  ctx.fillStyle = fill; ctx.fillRect(x, y, fw, h);
  ctx.fillStyle = hi; ctx.fillRect(x, y, fw, 1);
}
function circleBtn(b, { active = true, fill = 0 } = {}) {
  const r = b.r + (b.pressed ? -1 : 0);
  ctx.fillStyle = 'rgba(13,10,14,0.72)'; ctx.beginPath(); ctx.arc(b.x, b.y, r + 2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = active ? PAL.gold1 : PAL.stone2; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.stroke();
  if (fill > 0 && fill < 1) { ctx.strokeStyle = PAL.gold0; ctx.beginPath(); ctx.arc(b.x, b.y, r, -Math.PI / 2, -Math.PI / 2 + fill * Math.PI * 2); ctx.stroke(); }
  const ic = b.sealed ? 'lock' : b.icon;
  spr(ic === 'dagger' ? 'fx' : 'icons', ic, 0, b.x, b.y, { ax: ic === 'dagger' ? 4 : 8, ay: ic === 'dagger' ? 6 : 8, alpha: active ? 1 : 0.35 });
}

function renderHud() {
  const p = player;
  // Top-left: portrait, HP, Fervor.
  frameBox(6, 6, 22, 22);
  ctx.save(); ctx.beginPath(); ctx.rect(6, 6, 22, 22); ctx.clip();
  spr('saint', 'idle', Math.floor(game.real * 3), 17, 37, {});
  ctx.restore();
  bar(33, 7, 86, 6, p.hp / p.maxHp, PAL.blood1, PAL.blood3, PAL.blood0);
  text(`${Math.ceil(p.hp)}`, 35, 15, PAL.bone1, { shadow: PAL.outline });
  const tier = fervorTier();
  const fcol = [PAL.ember2, PAL.ember1, PAL.blood0, PAL.gold0][tier];
  bar(33, 23, 70, 4, game.fervor / 100, fcol, PAL.void, PAL.holy0);
  for (let i = 1; i < 4; i++) { ctx.fillStyle = PAL.gold2; ctx.fillRect(33 + Math.round(70 * i / 4), 23, 1, 4); }
  text(T.fervor.tiers[tier], 107, 22, fcol);
  // Top-right: minimap and pause.
  const mw = 46, mh = Math.round(46 * room.ph / room.pw), mx = W - 30 - mw, my = 6;
  frameBox(mx, my, mw, mh);
  const k = mw / room.pw;
  ctx.fillStyle = PAL.stone4;
  for (let y = 0; y < room.h; y++) for (let x = 0; x < room.w; x++) if (room.solid[y][x]) ctx.fillRect(mx + Math.floor(x * TILE * k), my + Math.floor(y * TILE * k), Math.ceil(TILE * k), Math.ceil(TILE * k));
  for (const e of enemies) { ctx.fillStyle = e.elite ? PAL.gold0 : PAL.blood0; ctx.fillRect(mx + Math.round(e.x * k), my + Math.round(e.y * k), 1, 1); }
  ctx.fillStyle = PAL.holy0; ctx.fillRect(mx + Math.round(p.x * k) - 1, my + Math.round(p.y * k) - 1, 2, 2);
  circleBtn(HUD.pause);
  text(`KILLS ${game.kills}`, W - 30, my + mh + 6, PAL.bone2, { align: 'right' });
  // Bottom-right: dash, Miracles, Penance.
  const dashK = p.charges >= T.dash.charges ? 1 : p.recharge / T.dash.recharge;
  circleBtn(HUD.dash, { active: p.charges > 0, fill: p.charges < T.dash.charges ? dashK : 0 });
  for (let i = 0; i < T.dash.charges; i++) { ctx.fillStyle = i < p.charges ? PAL.gold0 : PAL.stone2; ctx.fillRect(HUD.dash.x - 5 + i * 8, HUD.dash.y + HUD.dash.r + 4, 4, 2); }
  circleBtn(HUD.m1, { active: false }); circleBtn(HUD.m2, { active: false }); circleBtn(HUD.pen, { active: false });
  if (game.execTarget) circleBtn(HUD.exec, { active: true });
  // Bottom-left: joystick.
  if (stick.active) {
    ctx.strokeStyle = 'rgba(217,166,64,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 26, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(242,234,216,0.6)'; ctx.beginPath(); ctx.arc(stick.x, stick.y, 9, 0, Math.PI * 2); ctx.fill();
  } else if (game.time < 6) {
    text('MOVE', 40, H - 40, PAL.bone3, { align: 'center' });
  }
  if (game.toast) text(game.toast.msg, W / 2, 34, PAL.bone0, { align: 'center' });
  if (location.search.includes('fps')) text(`${Math.round(fpsAvg)} FPS ${enemies.length} E`, 6, H - 10, PAL.candle0);
}

function overlay(title, sub) {
  ctx.fillStyle = 'rgba(13,10,14,0.7)'; ctx.fillRect(0, 0, W, H);
  text(title, W / 2, H / 2 - 16, PAL.gold0, { sc: 3, align: 'center' });
  text(sub, W / 2, H / 2 + 8, PAL.bone1, { align: 'center' });
}

const ODDS = ['3 TO 1', '5 TO 2', '7 TO 4', '2 TO 1', 'EVENS', '9 TO 2'];
function renderTitle() {
  if (!PAL) return;
  ctx.fillStyle = PAL.outline; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H * 0.62, 10, W / 2, H * 0.62, H * 0.7);
  g.addColorStop(0, 'rgba(63,122,74,0.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (IMG.saint) spr('saint', 'idle', Math.floor(game.real * 4), W / 2, H * 0.62);
  text('HOLLOW SAINT', W / 2, H * 0.18, PAL.gold0, { sc: 4, align: 'center' });
  text('THE WORLD REMEMBERS WHAT YOU FORGET', W / 2, H * 0.18 + 28, PAL.bone2, { align: 'center' });
  if (Math.floor(game.real * 2) % 2 === 0) text('TAP TO DESCEND', W / 2, H * 0.78, PAL.bone0, { sc: 2, align: 'center' });
  text(`THE GILDED LAMB GIVES ${ODDS[Math.floor(game.real / 4) % ODDS.length]} ON YOUR DEATH TODAY`, W / 2, H - 14, PAL.candle1, { align: 'center' });
}

function renderReceipt() {
  const k = Math.min(1, game.deathT * 1.5);
  ctx.fillStyle = `rgba(13,10,14,${0.8 * k})`; ctx.fillRect(0, 0, W, H);
  if (k < 1) return;
  const r = game.receipt, w = 168, h = 120, x = Math.round(W / 2 - w / 2), y = Math.round(H / 2 - h / 2);
  ctx.fillStyle = PAL.bone1; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = PAL.bone0; ctx.fillRect(x, y, w, 2);
  for (let i = 0; i < w; i += 4) { ctx.fillStyle = PAL.outline; ctx.fillRect(x + i, y + h, 2, 2); } // torn edge
  const line = (s, yy, c = PAL.void, al = 'center') => text(s, al === 'center' ? W / 2 : x + 8, y + yy, c, { shadow: null, align: al });
  line('THE CHOIR OF VAEL', 8, PAL.blood2);
  line('RECEIPT OF DESCENT', 16);
  ctx.fillStyle = PAL.bone3; ctx.fillRect(x + 8, y + 25, w - 16, 1);
  const m = Math.floor(r.time / 60), s = String(Math.floor(r.time % 60)).padStart(2, '0');
  line(`TIME IN THE WOUND     ${m}:${s}`, 32, PAL.void, 'left');
  line(`RISEN RETURNED TO REST  ${r.kills}`, 41, PAL.void, 'left');
  line(`BEST FERVOR            ${r.fervor}%`, 50, PAL.void, 'left');
  line(`PERFECT DODGES          ${r.perfects}`, 59, PAL.void, 'left');
  ctx.fillStyle = PAL.bone3; ctx.fillRect(x + 8, y + 69, w - 16, 1);
  line('YOUR TITHE HAS BEEN', 76, PAL.blood2);
  line('GRATEFULLY RECEIVED.', 84, PAL.blood2);
  if (game.deathT > 1.6 && Math.floor(game.real * 2) % 2 === 0) line('TAP TO RISE AGAIN', 104);
}

function onTap() {
  if (game.state === 'title') { newRun(); game.state = 'play'; return true; }
  if (game.state === 'pause') { game.state = 'play'; return true; }
  if (game.state === 'dead' && game.deathT > 1.6) { newRun(); game.state = 'play'; return true; }
  return game.state !== 'play';
}

function blit() { sctx.drawImage(buf, 0, 0, W * SCALE, H * SCALE); }

// ---------------------------------------------------------------- loop ---
let last = 0, fpsAvg = 60;
function frame(t) {
  const dt = Math.min(1 / 30, (t - last) / 1000 || 0);
  last = t;
  if (dt > 0) fpsAvg = fpsAvg * 0.95 + (1 / dt) * 0.05;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
resize();
loadAssets().then(() => {
  if (location.search.includes('run')) { newRun(); game.state = 'play'; }
  requestAnimationFrame(frame);
}).catch((e) => { document.body.insertAdjacentHTML('beforeend', `<p style="color:#d9a640;font:14px monospace;padding:20px">Failed to load sprites: ${e}</p>`); });
// Exposed for automated play-tests.
window.HS = { game, T, get player() { return player; }, get bolts() { return bolts; }, get enemies() { return enemies; }, input, newRun, spawnEnemy };
</script>
</body>
</html>
