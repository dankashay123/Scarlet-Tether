<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>The Scarlet Tether</title>
    <meta name="description" content="A pixel-art body-horror roguelike of penance beneath a sinless city." />
    <meta name="theme-color" content="#0b0507" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scarlet Tether" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0507;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #0b0507;
        color: #c9a45c;
        font-family: Georgia, 'Times New Roman', serif;
        text-align: center;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 24px;
        box-sizing: border-box;
      }
      #rotate .glyph {
        font-size: 48px;
        color: #8a1020;
        margin-bottom: 16px;
      }
      #rotate p {
        margin: 6px 0;
        font-size: 18px;
        letter-spacing: 0.04em;
      }
      #rotate small {
        color: #7a6a5a;
        font-size: 13px;
      }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <div class="glyph">&#10014;</div>
      <p>Turn thy vessel upon its side.</p>
      <small>The Scarlet Tether is played in landscape.</small>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
