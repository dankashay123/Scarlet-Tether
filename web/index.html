<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>The Scarlet Tether</title>
    <meta name="description" content="A pixel-art body-horror roguelike of penance beneath a sinless city." />
    <meta name="theme-color" content="#0b0507" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scarlet Tether" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0507;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #0b0507;
        color: #c9a45c;
        font-family: Georgia, 'Times New Roman', serif;
        text-align: center;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 24px;
        box-sizing: border-box;
      }
      #rotate .phone {
        width: 44px;
        height: 76px;
        border: 3px solid #c9a45c;
        border-radius: 8px;
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8a1020;
        font-size: 28px;
        animation: tilt 2.4s ease-in-out infinite;
      }
      @keyframes tilt {
        0%, 25% { transform: rotate(0deg); }
        55%, 85% { transform: rotate(-90deg); }
        100% { transform: rotate(0deg); }
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #7a6a5a;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 16px;
        letter-spacing: 0.08em;
        pointer-events: none;
      }
      #crash {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        background: #0b0507;
        color: #e8d6a8;
        font-family: Georgia, serif;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      #crash code {
        display: block;
        max-width: 90vw;
        margin: 10px 0 16px;
        color: #ff6b6b;
        font-size: 12px;
        word-break: break-word;
        user-select: text;
        -webkit-user-select: text;
      }
      #crash button {
        font: inherit;
        color: #0b0507;
        background: #c9a45c;
        border: 0;
        padding: 10px 18px;
        border-radius: 4px;
      }
      #rotate p {
        margin: 6px 0 12px;
        font-size: 18px;
        letter-spacing: 0.04em;
      }
      #rotate small {
        color: #7a6a5a;
        font-size: 13px;
        line-height: 1.5;
        max-width: 320px;
      }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading">The tether frays&hellip;</div>
    <div id="rotate">
      <div class="phone"><div class="screen">&#10014;</div></div>
      <p>Turn thy vessel upon its side.</p>
      <small>The Scarlet Tether is played in landscape.<br />
        If it will not turn: swipe down from the top-right corner to open
        Control Center and switch off Portrait Orientation Lock.</small>
    </div>
    <div id="crash"></div>
    <script>
      // If anything fails before or during play, say so on screen instead of
      // leaving a blank page (there is no console on an iPhone).
      (function () {
        var shown = false;
        function report(msg) {
          if (shown) return;
          shown = true;
          var el = document.getElementById('crash');
          el.style.display = 'flex';
          el.innerHTML =
            '<p>The Under-Naves would not open.</p><code></code>' +
            '<button onclick="location.reload()">Try again</button>';
          el.querySelector('code').textContent = String(msg).slice(0, 400);
        }
        window.addEventListener('error', function (e) {
          report((e.message || 'Script failed to load') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          report('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
        });
        // If the game never boots, the script itself did not load.
        setTimeout(function () {
          if (!window.__booted) report('The game script did not start (timeout). Check your connection and try again.');
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
