name: Deploy to GitHub Pages

# The built game is committed in play/ (run `npm run build` before pushing),
# so this workflow publishes the repository as-is. That keeps it identical to
# what GitHub's "deploy from branch" mode would serve.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Committed build is up to date
        run: |
          npm run build
          git status --porcelain play
          test -z "$(git status --porcelain play)" || echo "::warning::play/ differs from a fresh build; run npm run build and commit"
  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
